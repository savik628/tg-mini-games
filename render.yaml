services:
  - type: web
    name: tg-mini-apps-platform
    env: python
    buildCommand: pip install -r bot/requirements.txt && pip install fastapi uvicorn cryptography aiosqlite pydantic
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
